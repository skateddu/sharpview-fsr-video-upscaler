<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture e2e</title>
  <style>
    body { margin: 8px; padding: 12px; background: #222; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
    .box { position: relative; }
    video { display: block; background: #000; }
    #contain { width: 960px; height: 720px; object-fit: contain; }
    #cover { width: 640px; height: 640px; object-fit: cover; }
    #fill { width: 800px; height: 300px; object-fit: fill; border: 7px solid #555; }
    #small { width: 320px; height: 180px; }
    #fixed { position: fixed; right: 20px; bottom: 20px; width: 480px; height: 270px; }
    #cross, #drm, #late, #ancestor, #scaled { width: 640px; height: 360px; }
    /* Transformed but non-positioned ancestor: containing block ≠ offsetParent. */
    #ancestor-wrap { transform: translateX(30px); }
    /* Typical player centering: translate(-50%, -50%). */
    #translated-box { position: relative; width: 700px; height: 400px; }
    #translated { position: absolute; left: 50%; top: 50%; width: 640px; height: 360px; transform: translate(-50%, -50%); }
    #scaled { transform: scale(1.1); transform-origin: 0 0; }
    #position { width: 960px; height: 720px; object-fit: contain; object-position: 0% 0%; }
    #frame { width: 700px; height: 400px; border: 0; }
    /* Far below the viewport. */
    #offscreen { position: absolute; top: 9000px; left: 0; width: 640px; height: 360px; }
  </style>
</head>
<body>
  <!-- Video in a positioned container: the canvas goes in the same containing block. -->
  <div class="box"><video id="contain" muted loop></video></div>
  <!-- Without a positioned container: offsetParent is the body. -->
  <video id="cover" muted loop></video>
  <div class="box"><video id="fill" muted loop></video></div>
  <video id="small" muted loop></video>
  <video id="fixed" muted loop></video>
  <video id="cross" muted loop></video>
  <video id="drm" muted loop></video>
  <div id="ancestor-wrap"><video id="ancestor" muted loop></video></div>
  <div id="translated-box"><video id="translated" muted loop></video></div>
  <video id="scaled" muted loop></video>
  <video id="position" muted loop></video>
  <shadow-player id="shadow-host"></shadow-player>
  <iframe id="frame" src="/frame.html"></iframe>
  <video id="offscreen" muted loop></video>

  <script>
    const params = new URLSearchParams(location.search);
    const sample = '/sample.webm';

    // Player with the video inside an open shadow root.
    customElements.define('shadow-player', class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = '<style>:host{display:block;position:relative}video{display:block;width:640px;height:360px}</style>' +
          '<video id="shadow" muted loop></video>';
        const v = root.getElementById('shadow');
        v.src = sample;
        v.play();
      }
    });

    for (const id of ['contain', 'cover', 'fill', 'small', 'fixed', 'drm', 'ancestor', 'translated', 'scaled', 'position', 'offscreen']) {
      const v = document.getElementById(id);
      v.src = sample;
      v.play();
    }
    // Cross-origin without CORS: the frame is not readable by WebGL.
    const cross = document.getElementById('cross');
    cross.src = params.get('cross');
    cross.play();

    // A video with MediaKeys (ClearKey) must be treated as DRM-protected.
    navigator.requestMediaKeySystemAccess('org.w3.clearkey', [{
      initDataTypes: ['webm'],
      videoCapabilities: [{ contentType: 'video/webm; codecs="vp8"' }],
    }])
      .then((access) => access.createMediaKeys())
      .then((keys) => document.getElementById('drm').setMediaKeys(keys))
      .then(() => (document.body.dataset.drm = 'ok'))
      .catch((e) => (document.body.dataset.drm = 'error: ' + e));

    // Video added after load.
    setTimeout(() => {
      const v = Object.assign(document.createElement('video'), { id: 'late', muted: true, loop: true, src: sample });
      document.getElementById('fill').parentElement.after(v);
      v.play();
    }, 1000);
  </script>
</body>
</html>
